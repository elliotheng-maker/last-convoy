// ---- drive sheet: stop cards instead of a tiny map ----
function frontTag(n){const d=S.front-n.dist;return d>=1.2?'<span class="ftag deep">✕ OVERRUN</span>':d>=0?'<span class="ftag wave">WAVE</span>':d>=-.52?'<span class="ftag next">falls next</span>':''}
function driveSheet(){const c=cur(),cost=fuelCost(),ne=nightExtra(),drv=driver();
  const stops=c.links.map(node).sort((a,b)=>b.dist-a.dist);
  const card=d=>{const g=frontGainEst(false,c,d),gn=frontGainEst(true,c,d),a=d.dist-S.front-g,an=d.dist-S.front-gn;
    const why=S.truck<=0?'Bus wrecked: repair first':S.res.fuel<cost?`Need ${cost} fuel`:'';
    const arr=a<0?`<span class="bad">You'd arrive inside the front${an>=0?' (a night drive gets you ahead)':''}</span>`:`<span class="dim">Front ${a.toFixed(1)}d behind on arrival</span>`;

/* ================= main loop ================= */
let last=0,hudT=0;
function startLoop(){if(ui.rafId)return;last=performance.now();ui.rafId=requestAnimationFrame(loop)}
function stopLoop(){if(ui.rafId)cancelAnimationFrame(ui.rafId);ui.rafId=0}
function loop(ts){
  ui.rafId=0;
  if(!S||screen!=='game'||S.screen!=='raid'||!S.raid)return;
  const dt=Math.min(.1,(ts-last)/1000);last=ts;
  const r=S.raid;
  if(r.intro>0&&!S.modal){r.intro-=dt}
  else if(r.speed>0&&!S.modal){ui.aT=(ui.aT||0)+dt*1000;let t=dt*r.speed;while(t>0&&S.raid){const st=Math.min(t,.04);sim(st);t-=st}}

}

const BVAL={fuel:6,food:4,meds:8,ammo:4,parts:6,traps:4,lure:2,morph:16,anti:40};
const BKEYS=Object.keys(BVAL);
const WANT={village:{ammo:1.4,meds:1.4,parts:1.2,food:.6},camp:{food:1.4,meds:1.3,fuel:1.2,parts:.7,traps:.7},safe:{ammo:1.2,food:1.2,fuel:1.1}};
const STOCK={village:{food:[6,10],fuel:[1,4],traps:[1,3],lure:[1,3]},camp:{parts:[3,6],traps:[2,5],ammo:[2,4],meds:[1,3],lure:[1,2]},safe:{fuel:[4,8],food:[4,8],meds:[2,4],ammo:[4,8],parts:[2,5],traps:[2,4],morph:[1,2],anti:[0,1]}};
function stockOf(n){if(!n.stock){n.stock={};Object.entries(STOCK[n.type]||{}).forEach(([k,[a,b]])=>n.stock[k]=rnd(a,b))}return n.stock}
const wantOf=(n,k)=>(WANT[n.type]||{})[k]||1;
const giveVal=(n,k)=>Math.max(1,Math.round(BVAL[k]*wantOf(n,k)*.9));               // what they pay for yours
const askVal=(n,k)=>Math.max(1,Math.round(BVAL[k]*(wantOf(n,k)<1?.85:1.25)*(1+(NOT()>=2?.07*NOT():NOT()<=-5?-.02*(-NOT()):0))*(n.type==='safe'&&standTier(n)>=2?.8:1))); // what they charge for theirs
function barterTotals(n){const B=ui.bar||{give:{},get:{}};let o=0,a=0;Object.entries(B.give).forEach(([k,v])=>o+=v*giveVal(n,k));Object.entries(B.get).forEach(([k,v])=>a+=v*askVal(n,k));return {o,a}}
function barter(){const n=cur(),B=ui.bar,st=stockOf(n);if(!B||refuses(n))return;const {o,a}=barterTotals(n);
  if(a<=0||o<a)return;if(Object.entries(B.give).some(([k,v])=>S.res[k]<v)||Object.entries(B.get).some(([k,v])=>(st[k]||0)<v))return;
  Object.entries(B.give).forEach(([k,v])=>{if(v){spend(k,v);st[k]=(st[k]||0)+v}});Object.entries(B.get).forEach(([k,v])=>{if(v){gain(k,v);st[k]-=v}});
  log(`Bartered ${fmt(B.give)} for ${fmt(B.get)}.`,'good');addStand(n,1);AUD.play('good');ui.bar={give:{},get:{}};save();render()}
function barterHTML(n){
  const B=ui.bar=ui.bar||{give:{},get:{}},st=stockOf(n),{o,a}=barterTotals(n);
  const row=(side,k,have,val)=>{const v=B[side][k]||0;return `<div class="brow ${v?'on':''}"><span>${resLabel(k)} <span class="dim small">${have} ${side==='give'?'yours':'in stock'}</span></span><span class="bval" title="${side==='give'?'what they pay per unit':'what they charge per unit'}">⛁${val}</span>
    <span class="bstep"><button class="btn tiny" data-a="bar" data-arg="${side}|${k}|-1" ${v<=0?'disabled':''} aria-label="Less ${resLabel(k)}">−</button><b>${v}</b><button class="btn tiny" data-a="bar" data-arg="${side}|${k}|1" ${v>=have?'disabled':''} aria-label="More ${resLabel(k)}">+</button></span></div>`};
  const mine=BKEYS.filter(k=>S.res[k]>0).map(k=>row('give',k,S.res[k],giveVal(n,k))).join('')||'<p class="dim small">You have nothing to offer.</p>';

    <div class="grid2" style="margin-top:6px"><div><span class="eyebrow">You give</span>${mine}</div><div><span class="eyebrow">You get</span>${theirs}</div></div>
    <div class="bmeter"><div class="bbar"><i style="width:${pct}%;background:${ok?'#74d68a':'#e2c341'}"></i></div>
      <span class="small">Your offer <b>⛁${o}</b> · they ask <b>⛁${a}</b> · ${a<=0?'pick something you want':ok?(o>a?`<span style="color:#a9dd9a">deal (you overpay by ⛁${o-a})</span>`:'<span style="color:#a9dd9a">fair deal</span>'):`<span style="color:#e2c341">add ⛁${a-o} more</span>`}</span></div>
    <div class="row" style="margin-top:6px"><button class="btn primary" data-a="barter" ${ok?'':'disabled'}>Make the trade</button><button class="btn" data-a="barclear">Clear</button></div>`;

/* ---------- raid panels (updated live) ---------- */
function stOf(s){
  const m=memOf(s);
  if(s.state==='dead')return 'Down';if(s.state==='out')return 'Back on the bus';
  if(s.trans)return s.trans.to?'Crouching':'Standing up';
  if(s.aim)return s.ready?`Aiming ${Math.round(accOf(s)*100)}%`:'Readying weapon';
  if(s.busy)return {search:'Searching',bandage:'Bandaging',throw:'Throwing',trap:'Setting a trap',pry:s.busy.win?'Working a window (can\'t see)':'Prying boards (can\'t see)',kick:'Kicking a door',smash:'Smashing a window'}[s.busy.kind];
  if(s.pin>0)return 'Pinned!';
  if(s.order&&s.order.type==='unload')return 'Heading to the bus';
  if(s.frozen)return 'Holding still';
  if(stalking(s))return 'Creeping up';
  if(s.to||s.path.length)return s.sneak?'Sneaking':'Moving';
  if(s.cd>0)return 'Fighting';
  return 'Waiting';
}

    <p class="small dim">Hands: ${esc(wName(s.load.melee))}${s.load.ranged!=='none'?' · '+esc(wName(s.load.ranged)):''}</p>
    ${busRow}${rows}
    ${mates.length?'':'<p class="dim small" style="margin-top:4px">Stand next to another scavenger to hand things over.</p>'}
    ${pile?`<div class="prow" style="margin-top:6px"><span>On the ground: ${esc(listItems(pile.items))}</span><button class="btn tiny" data-a="pickup">Pick up</button></div>`:''}</div></section>`;
