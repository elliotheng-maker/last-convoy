<meta charset="utf-8">
<title>Last Convoy Mobile</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=fallback">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* phone edition: same outline as the PC one, stacked, with the action bar pinned to the thumb */
/* Layout: one-screen cockpit like FTL. Top: bus hull + supplies. Left: crew. Centre: route map or live scavenging map. Right: location + log. Bottom: action bar. Single deliberate night palette. */
:root{
  --ink:#0a110f; --panel:#141e1a; --raise:#1d2a25; --well:#0d1512; --edge:#a9b8ad; --edge-dim:#3f5148; --fg:#e6e0cc; --dim:#8e9c90;
  --amber:#f0a83a; --amber-deep:#9a6618; --green:#74d68a; --teal:#6fc3c9; --blood:#e0533a; --warn:#e2c341;
  --display:'Pixelify Sans','Courier New',monospace;
  --body:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
body{background:radial-gradient(ellipse at 50% 35%,#18261f 0%,var(--ink) 75%);color:var(--fg);font-family:var(--body);font-size:12.5px;line-height:1.4;overflow:hidden}
@media (max-width:980px),(max-height:560px){body{overflow:auto}}
#app{box-sizing:border-box;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
@media (max-width:980px),(max-height:560px){#app{height:auto;min-height:100%}}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
p{margin:3px 0}
.dim{color:var(--dim)}
.small{font-size:11px}

.pnl{background:var(--panel);border:2px solid var(--edge-dim);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),0 3px 0 rgba(0,0,0,.45);min-width:0;min-height:0}
.ptitle{font-family:var(--display);font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;color:var(--edge);padding:3px 9px;background:var(--well);border-bottom:2px solid var(--edge-dim);border-radius:4px 4px 0 0;display:flex;justify-content:space-between;gap:8px}
.pbody{padding:8px 10px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:6px 10px}
.logo{font-family:var(--display);font-size:18px;color:var(--amber);letter-spacing:.05em;background:none;border:0;padding:0;cursor:pointer}
.hullwrap{display:flex;align-items:center;gap:8px}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.hull{display:flex;gap:2px;padding:3px;border:2px solid var(--edge-dim);border-radius:4px;background:var(--well)}
.hull i{width:9px;height:14px;background:#24302b}
.hull i.on{background:var(--green)}
.hull.hmid i.on{background:var(--warn)}
.hull.low i.on{background:var(--blood)}
.res{display:flex;flex-wrap:wrap;gap:4px}
.rc{display:flex;align-items:baseline;gap:5px;padding:2px 7px;border:2px solid var(--edge-dim);border-radius:4px;background:var(--well);font-variant-numeric:tabular-nums}
.rc span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.rc b{font-family:var(--display);font-size:14px}
.rc.low{border-color:var(--blood)}.rc.low b{color:var(--blood)}
.front{margin-left:auto;display:flex;align-items:center;gap:8px;padding:2px 10px;border:2px solid var(--blood);border-radius:4px;background:#2a1210}
.front b{font-family:var(--display);font-size:15px;color:#f3a493}
.front.danger{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#5a1a12}}
.speed{display:flex;gap:3px}

.mid{display:grid;grid-template-columns:236px minmax(0,1fr) 270px;gap:8px;min-height:0}
@media (max-width:980px),(max-height:560px){.mid{grid-template-columns:minmax(0,1fr)}.mid>.center{order:-1;min-height:360px}}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.scroll{overflow:auto;min-height:0}
.center{position:relative;display:flex;flex-direction:column;overflow:hidden}
.mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.mapwrap svg{width:100%;height:100%;display:block}
.mapzoom{position:absolute;top:12px;right:12px;z-index:2;background:#0d1512e6}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--dim);padding:4px 10px 6px;border-top:2px solid var(--edge-dim);background:var(--well);border-radius:0 0 4px 4px}

.btn{font:inherit;font-size:12px;background:var(--raise);color:var(--fg);border:2px solid var(--edge-dim);border-radius:5px;padding:5px 9px;cursor:pointer;text-align:left}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;color:var(--dim);font-size:10.5px}
.btn.primary{background:var(--amber);color:#1b1306;border-color:var(--amber-deep)}
.btn.primary small{color:#5c3f0e}
.btn.on{background:var(--green);color:#0d1f12;border-color:#3d8a50}
.btn.on small{color:#1f4a2a}
.btn.danger{border-color:var(--blood);color:#f2b6a9}
.btn.tiny{padding:1px 6px;font-size:11px;border-width:1px}

.crew{display:flex;flex-direction:column;gap:6px;padding:6px}
.card{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 8px;padding:6px;border:2px solid var(--edge-dim);border-radius:5px;background:var(--well)}
.card.sel{border-color:var(--amber)}
.card.away{border-color:var(--teal)}
.cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.stat{display:grid;gap:2px;padding:4px 5px 5px;background:#0e1613;border:1px solid #2c3a33;border-radius:4px;text-align:left;min-width:0}
.sv{display:flex;align-items:baseline;gap:4px}.sv i{font-style:normal;font-size:11px}.sv b{display:inline;font-family:var(--display);font-size:16px;line-height:1;color:#e6e0cc}
.sl{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{display:block;height:3px;background:#1f2a25;border-radius:2px;overflow:hidden}.sbar i{display:block;height:100%}
.perk{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--dim);text-align:left;line-height:1.3}
.perk b{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap;flex:none}
.perk .pt{background:#3a2f17;color:#f0c46a}.perk .pq{background:#1f3236;color:#8fd3da}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{font-size:11px;padding:1px 7px;border:1px solid #3f5148;border-radius:10px;color:var(--fg);white-space:nowrap}
.tag.good{border-color:#3d6b45;color:#a9dd9a;background:#16261a}
.face{width:34px;height:34px;border-radius:4px;display:grid;place-items:center;overflow:hidden}
.cname{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.cname strong{font-family:var(--display);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#26322d;border-radius:1px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.hmid i{background:var(--warn)}.bar.low i{background:var(--blood)}
.bar.st i{background:var(--amber)}
.cstat{font-size:10.5px;color:var(--dim);grid-column:1/-1}
.cstat .bad{color:#f3a493}.cstat .good{color:var(--green)}
.cbtns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px}

.loc h2{font-size:19px;line-height:1.1}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:11px;margin-top:4px}
.tier i{width:10px;height:10px;border-radius:2px;display:inline-block}
.log{list-style:none;margin:0;padding:6px 10px;display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.log li.bad{color:#f09a86}.log li.good{color:#a9dd9a}.log li.warn{color:var(--amber)}
.log .d{color:var(--dim);margin-right:5px}

.bottom{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;padding:6px}
.sys{display:grid;justify-items:center;align-content:center;gap:1px;min-width:88px;padding:5px 8px;font-family:var(--display);text-align:center}
.sys i{font-style:normal;font-size:16px;color:var(--green);line-height:1}
.sys span{font-size:12px}
.sys small{font-family:var(--body)}
.sys.on i{color:#0d1f12}
.sep{width:2px;background:var(--edge-dim);margin:2px 4px}
.grow{flex:1}

.tabs{display:flex;gap:4px;padding:6px 6px 0}
.vtabs{display:flex;gap:4px;padding:6px 6px 0;border-bottom:2px solid var(--edge-dim)}
.vtab{font-family:var(--display);font-size:14px;letter-spacing:.06em;padding:4px 16px;border:2px solid var(--edge-dim);border-bottom:0;border-radius:5px 5px 0 0;background:var(--well);color:var(--dim);cursor:pointer}
.vtab.cur{background:var(--raise);color:var(--amber);border-color:var(--edge)}
.busview{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.busview svg{width:100%;height:100%;display:block}
.busview .room{cursor:pointer}
.busview .room:hover rect.rf{stroke:#f0a83a}
.busview .fig,.busview .arm,.busview .zz,.busview .spark,.busview .pulse{transform-box:fill-box}
.fig-roof{animation:sway 3.2s ease-in-out infinite}
.fig-store{animation:pace 5s ease-in-out infinite}
.fig-shop{animation:bob .6s steps(2) infinite}
.busview .arm{transform-origin:50% 0;animation:hammer .6s steps(2) infinite}
.busview .spark{animation:spark .6s steps(1) infinite}
.busview .zz{animation:zz 2.4s linear infinite;opacity:0}
.busview .pulse{transform-origin:center;animation:pulsep 1.4s ease-in-out infinite}
.fig-bunks{animation:breathe 3s ease-in-out infinite}
.busview .reach,.busview .swing{transform-box:fill-box}
.busview .reach{animation:reach 1.8s ease-in-out infinite}
.busview .swing{transform-origin:50% 0;animation:swing 3.4s ease-in-out infinite}
@keyframes reach{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes swing{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes sway{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes pace{0%,100%{transform:translateX(0)}45%,55%{transform:translateX(34px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes hammer{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-70deg)}}
@keyframes spark{0%,60%,100%{opacity:0}5%,30%{opacity:1}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes pulsep{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-.8px)}}
@media (prefers-reduced-motion:reduce){.busview .reach,.busview .swing,.fig-roof,.fig-store,.fig-shop,.fig-bunks,.busview .arm,.busview .spark,.busview .zz,.busview .pulse{animation:none}.busview .zz{opacity:1}}
.tab{flex:1;display:grid;gap:3px;padding:4px 8px;border:2px solid var(--edge-dim);border-bottom:0;border-radius:5px 5px 0 0;background:var(--well);color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.btn.sys.next{background:linear-gradient(#f6b84a,#e0922a);color:#1b1306;border-color:#ffd88a;box-shadow:0 0 0 2px rgba(240,168,58,.3),0 0 16px rgba(240,168,58,.5);animation:nudge 1.8s ease-in-out infinite}
.btn.sys.next i,.btn.sys.next small{color:#3b2706}
.btn.sys.go{background:linear-gradient(#45a464,#2c7444);color:#effff2;border-color:#8be3a0;box-shadow:0 0 0 2px rgba(116,214,138,.25),0 0 16px rgba(116,214,138,.45);animation:nudge 1.8s ease-in-out infinite}
.btn.sys.go i,.btn.sys.go small{color:#d8f7df}
@keyframes nudge{50%{filter:brightness(1.18)}}
.stepb{font-style:normal;display:inline-grid;place-items:center;width:15px;height:15px;margin-right:5px;border-radius:50%;background:#1b1306;color:#f0c46a;font-size:10px;vertical-align:1px}
.btn.sys.go .stepb{background:#123a20;color:#a9f0b9}
.road{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid #22302a;font-size:12px;line-height:1.35}
.road .ri{color:var(--amber);text-align:center}.rg{color:#a9dd9a}
.tip{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:5px;padding:4px 6px;border:1px dashed #5a4a22;border-radius:4px;font-size:11.5px;background:#1d1a10}
@media (prefers-reduced-motion:reduce){.btn.sys.next,.btn.sys.go{animation:none}}
.bgrp{display:flex;flex-direction:column;gap:3px;padding:3px 6px 5px;border:1px solid var(--edge-dim);border-radius:5px;background:var(--well)}
.bgrp.opt-g{flex:1;min-width:0}
.bgrp .sys{min-width:72px;padding:5px 7px}.bgrp .sep{margin:2px 1px}
.bgrp .gh{font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center}
.bgrp .gh .opt{text-transform:none;letter-spacing:0;margin-left:4px;font-family:var(--body);font-size:10px}
.bgrp .gh .stepb{background:#24302b;color:var(--dim)}
.bgrp .gb{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;flex:1}
.bgrp.now{border-color:var(--amber-deep)}.bgrp.now .gh{color:var(--amber)}.bgrp.now .gh .stepb{background:var(--amber);color:#1b1306}
.bgrp.now.go{border-color:#3d8a50}.bgrp.now.go .gh{color:#8be3a0}.bgrp.now.go .gh .stepb{background:#45a464;color:#0d1f12}
.bgrp.done{opacity:.75}
.btn.sys.confirm{border-color:var(--blood);background:#2a1512;animation:pulse 1s steps(2) infinite}.btn.sys.confirm span{color:#f3a493}
.btn.sys.ready{border-color:#3d8a50}.btn.sys.ready small{color:#a9dd9a}
.btn.blue{border-color:#3d6fa3;background:#14202e}.btn.blue:hover:not(:disabled){border-color:#7fc4ff}
.btn.enc-safe{border-left:4px solid #6f8278}.btn.enc-low{border-left:4px solid #e2c341}.btn.enc-high{border-left:4px solid #e0533a}.enc-safe .etag{color:var(--dim)}.enc-low .etag{color:#e2c341}.enc-high .etag{color:#f09a86}
.btn.enc-help{border-left:4px solid #74d68a}.btn.enc-stay{border-left:4px solid #5fc4cc}.enc-stay .etag{color:#5fc4cc}.btn.enc-risk{border-left:4px solid #e2c341}.btn.enc-rob{border-left:4px solid #e0533a}.btn.enc-leave{border-left:4px solid #3f5148}
.etag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}.enc-help .etag{color:#74d68a}.enc-risk .etag{color:#e2c341}.enc-rob .etag{color:#f09a86}.enc-leave .etag{color:var(--dim)}
.btn.sys.encb{border-color:#6fc3c9;box-shadow:0 0 0 1px rgba(111,195,201,.35),0 0 10px rgba(111,195,201,.25)}.btn.sys.encb i{color:#6fc3c9}
.dghost{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border:1px solid var(--amber);border-radius:12px;background:rgba(20,30,26,.95);font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.dghost svg{border-radius:50%}body.dragging{cursor:grabbing}body.dragging *{cursor:grabbing!important}
.busview .room.dragover rect.rf{stroke:#74d68a;stroke-dasharray:6 4;fill:#1f3327}
.busview [data-a="pickc"]{cursor:grab}
.dghost{flex-direction:column;align-items:center;gap:0;padding:0;border:0;background:none;box-shadow:none;animation:lift .2s ease-out}
.dghost span{margin-top:2px;padding:0 6px;border:1px solid var(--amber);border-radius:8px;background:rgba(20,30,26,.95);font-size:11px}
.dghost.ok span{border-color:#74d68a;color:#a9f0b9}
.dfig{transform-origin:50% 0;animation:dangle .9s ease-in-out infinite;filter:drop-shadow(0 6px 3px rgba(0,0,0,.45))}
.dfig .dlegl,.dfig .dlegr,.dfig .darms{transform-box:fill-box;transform-origin:50% 0}
.dfig .dlegl{animation:kick .45s ease-in-out infinite}.dfig .dlegr{animation:kick .45s ease-in-out infinite reverse}.dfig .darms{animation:flail .6s ease-in-out infinite}
@keyframes lift{from{transform:scale(.55) translateY(10px);opacity:.2}}
@keyframes dangle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes kick{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes flail{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.lifted{opacity:.25;transition:opacity .15s}.busview .lifted,.rchip.lifted{opacity:0}
.busview .landed,.rchip.landed{transform-box:fill-box;animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:translateY(-16px)}55%{transform:translateY(2px)}75%{transform:translateY(-2px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.dfig,.dfig *,.dghost,.busview .landed,.rchip.landed{animation:none}}
.busview .room.strong rect.rf{stroke:#f0c46a;stroke-width:3}.busview .room.strong.dragover rect.rf{stroke:#ffd88a;fill:#2a2a16}
.fitbadge{font-family:'Pixelify Sans',monospace;font-size:11px;fill:#f0c46a;color:#f0c46a}
.rdrop{position:relative}span.fitbadge{position:absolute;top:4px;right:4px;font-size:10px;padding:0 5px;border:1px solid #6b5a2a;border-radius:8px;background:#2a2412;white-space:nowrap;pointer-events:none}
.rdrop.strong{box-shadow:inset 3px 0 0 #f0c46a}.rdrop.strong.over{background:rgba(240,196,106,.14);outline-color:#f0c46a}
.dghost.fit span{border-color:#f0c46a;color:#ffe3a3}
.brow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:3px 4px;border-bottom:1px dashed var(--edge-dim);font-size:12px}
.brow.on{background:#1f2a24}.bval{color:#e2c341;font-variant-numeric:tabular-nums;font-size:11px}
.bstep{display:flex;align-items:center;gap:4px}.bstep b{min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.bmeter{margin-top:8px;display:grid;gap:4px}.bbar{height:8px;border-radius:4px;background:#24302b;overflow:hidden}.bbar i{display:block;height:100%;transition:width .15s}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.itile{padding:6px 8px;border:1px solid var(--edge-dim);border-radius:5px;background:var(--well);display:grid;gap:2px}.itile.zero{opacity:.55}
.inum{font-family:var(--display);font-size:18px;color:var(--amber)}
.incbar{margin:6px 6px 0;padding:5px 9px;border:2px solid var(--blood);border-radius:5px;background:#2a1210;font-size:12px;animation:pulse 1.2s steps(2) infinite}
.incbar b{color:#f3a493;font-family:var(--display)}
.busview .incpulse{animation:incp 1s ease-in-out infinite}@keyframes incp{50%{opacity:.35}}
.busview .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .35s steps(2) infinite}@keyframes flick{50%{transform:scaleY(.75) scaleX(1.1)}}
.busview .smoke{transform-box:fill-box;animation:smk 2s ease-out infinite}@keyframes smk{0%{transform:translateY(0) scale(.6);opacity:.7}100%{transform:translateY(-40px) scale(1.6);opacity:0}}
.busview .zsway{transform-box:fill-box;transform-origin:50% 100%;animation:zsw 1.1s ease-in-out infinite}@keyframes zsw{0%,100%{transform:rotate(-5deg) translateX(-3px)}50%{transform:rotate(5deg) translateX(3px)}}
@media (prefers-reduced-motion:reduce){.incbar,.busview .incpulse,.busview .flame,.busview .smoke,.busview .zsway{animation:none}}
.busview .dogbob{transform-box:fill-box;animation:bob 1.2s steps(2) infinite}.busview .dogtail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .3s steps(2) infinite}@keyframes wag{50%{transform:rotate(-30deg)}}
.busview .smoke{animation:smoke 2.4s ease-out infinite}@keyframes smoke{0%{transform:translate(0,0);opacity:.9}100%{transform:translate(-14px,-10px);opacity:0}}
.busview .drip{transform-box:fill-box;animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:.9}100%{transform:translateY(9px);opacity:0}}
@media (prefers-reduced-motion:reduce){.busview .drip,.busview .smoke{animation:none}}

  if(st==='roof'){if(m.trait==='Brawler')o.push('Brawler: counts double');if(m.quirk==='Steady hands')o.push('Steady hands: counts double');if(m.quirk==='Sharpshooter')o.push('Sharpshooter: +1 defense');if(m.quirk==='Hawk-eyed')o.push('Hawk-eyed: fewer zombies drawn to the bus, spots roadside caches while driving');if(m.trait==='Scout')o.push('Scout: spots roadside caches while driving');if(m.quirk==='Thick-skinned')o.push('Thick-skinned: half as likely to get hurt')}
  if(st==='shop'){if(m.trait==='Mechanic')o.push('Mechanic: +1 bus and +1 research per run, part repairs fix 5, patches the bus +1 per drive');if(m.quirk==='Handy')o.push('Handy: +1 research per run and per drive');if(m.lost.length)o.push('Amputee: +1 research per run, and per rest day')}
  if(st==='bunks'){if(m.trait==='Medic')o.push('Medic: everyone in the bunks heals 1 more (also on drives), amputations +10%');if(m.quirk==='Pharmacist')o.push('Pharmacist: meds used on the bus heal 1 more')}
  if(st==='store'){if(m.quirk==='Lucky')o.push('Lucky: spare-supply and haul-sorting chance 50%');if(m.quirk==='Pack mule')o.push('Pack mule: scavengers carry 2 kg more')}
  return o;
}

function driver(){
  let d=S.driver&&byId(S.driver);
  if(!d||!canAct(d)){const c=alive().filter(canAct);d=c.find(x=>x.trait==='Driver')||c.find(x=>x.trait==='Scout')||c.find(x=>x.quirk==='Night owl')||c[0]||alive()[0];S.driver=d?d.id:null}
  return d;
}
const drvIs=pred=>{const d=driver();return !!(d&&pred(d))};
const atSt=(st,pred)=>alive().filter(c=>S.station[c.id]===st&&canAct(c)&&!(S.raid&&S.raid.party.some(p=>p.mid===c.id))&&(!pred||pred(c)));
function defaultStation(m){
  const free=st=>alive().filter(c=>c!==m&&S.station[c.id]===st).length<capSt(st);
  if(!canAct(m)||m.hp<=Math.ceil(m.max/3))return 'bunks';
  if(m.trait==='Mechanic'&&free('shop'))return 'shop';
  if(m.trait==='Medic'&&free('bunks'))return 'bunks';
  if(m.trait==='Brawler'&&free('roof'))return 'roof';
  return ['roof','shop','store','bunks'].find(free)||'bunks';
}
function ensureStations(){
  if(!S.station)S.station={};
  alive().forEach(c=>{if(!S.station[c.id]||!STATIONS[S.station[c.id]])S.station[c.id]=defaultStation(c);if(!canAct(c))S.station[c.id]='bunks'});
}
function moveTo(id,st){
  const m=byId(id);if(!m||!STATIONS[st])return;
  if(!canAct(m)&&st!=='bunks'){log(`${m.name} is recovering and has to stay in the bunks (morphine lets them work today).`,'warn');return}
  const here=alive().filter(c=>c!==m&&S.station[c.id]===st);
  if(here.length>=capSt(st)){
    if(capSt(st)===1&&here[0]){S.station[here[0].id]=S.station[id]||'roof'}
    else{log(`The ${STATIONS[st].name.toLowerCase()} is full.`,'warn');return}
  }
  S.station[id]=st;
}

function addXp(m,n){
  if(!m||!m.alive)return;
  m.xp+=n;

function genMap(){
  const nodes={};
  const typeFor=(tier,c)=>weighted((tier===2?[['town',3],['army',c>=3?1.6:.6],['clinic',1]]:tier===1?[['town',2],['fuel',2],['clinic',1.4],['village',1]]:[['village',2.5],['fuel',2],['camp',c>=2?1.4:0],['clinic',.6]]).filter(w=>w[1]>0));
  SABAH.forEach(([id,name,c,tier,x,y,type])=>{nodes[id]={id,name,col:c,tier,x,y,type:type||typeFor(tier,c),raids:0,links:[],visited:false,traded:{},delayed:{},bridge:c>0&&chance(.4)}});
  ROADS.forEach(([a,b])=>{nodes[a].links.push(b);nodes[b].links.push(a)});
  // road distance from KK, in days: how soon the infection gets there
  const dist={s:0},todo=new Set(Object.keys(nodes));
  while(todo.size){let u=null;todo.forEach(k=>{if(dist[k]!==undefined&&(u===null||dist[k]<dist[u]))u=k});if(u===null)break;todo.delete(u);
    nodes[u].links.forEach(v=>{const w=Math.hypot(nodes[u].x-nodes[v].x,nodes[u].y-nodes[v].y)/88;if(dist[v]===undefined||dist[u]+w<dist[v])dist[v]=dist[u]+w})}
  Object.values(nodes).forEach(n=>n.dist=+(dist[n.id]||0).toFixed(2));
  nodes.s.visited=true;
  return nodes;
}

function advanceDay(){

function autoAssign(){

}

/* ================= quests: promises that pay off a few stops later ================= */
const QUEST_TITLE={sister:'Find Aina, the radio kid\'s sister',cache:'Dig up the soldier\'s cache',son:'Bring medicine to the diabetic father'};
function addQuest(id){
  S.quests=S.quests||[];const c=col();
  let pool=Object.values(S.map).filter(n=>n.col>=c+2&&n.col<=c+3&&!['safe','evac','start'].includes(n.type)&&!S.quests.some(q=>q.node===n.id));
  if(!pool.length)pool=Object.values(S.map).filter(n=>n.col===c+1&&!['safe','evac','start'].includes(n.type));
  if(!pool.length)return '';const t=pick(pool);S.quests.push({id,node:t.id,title:QUEST_TITLE[id]});
  log(`New promise: ${QUEST_TITLE[id]} at ${t.name}.`,'good');return ` ✦ Quest added: ${t.name}, ${t.col-c} stop${t.col-c>1?'s':''} ahead. It's marked on the route map.`;
}

const NOT=()=>S.notor||0;
const NOT_LV=[[-10,'Heroes of the road','#5fc4cc'],[-5,'Good name','#74d68a'],[-1,'Unknown','#a9b8ad'],[2,'Talked about','#e2c341'],[5,'Notorious','#e88f5a'],[8,'Hunted','#e0533a']];
const notLv=()=>NOT_LV.slice().reverse().find(l=>NOT()>=l[0]);
function addNot(n,why){const b=notLv()[1];S.notor=Math.max(-10,Math.min(10,NOT()+n));const a=notLv()[1];
  if(n>0)alive().filter(c=>c.trait==='Medic').forEach(md=>alive().forEach(o=>bondAdd(md,o,-5)));
  if(n>0)log(`Word spreads${why?' that '+why:''}. Notoriety +${n}${a!==b?` · you're now ${a.toLowerCase()}`:''}.`,'bad');
  else if(n<0)log(`Word of your kindness travels. Reputation ${NOT()}${a!==b?` · you're now ${a==='Unknown'?'unknown again':a.toLowerCase()}`:''}.`,'good')}
let ableMiss=null;
const able=pred=>{const L=alive().filter(c=>canAct(c)&&pred(c)),w=L.find(c=>!unwilling(c));if(!w&&L.length)ableMiss=L[0];return w};
const isT=t=>c=>c.trait===t;
const nm1=c=>c?c.name:'Someone';
const ENC_ICON={stay:'⌂',help:'♥',risk:'⚠',rob:'✖',leave:'→',safe:'○',low:'◐',high:'●'};
const TAG_LABEL={stay:'Stay',help:'Help',risk:'Risk',rob:'Rob',leave:'Pass',safe:'No risk',low:'Low risk',high:'High risk'};
// stay a day to guard people: costs time and a night watch; pays moderately
function stayGuard(pay,who){
  advanceDay();S.front+=.4;alive().forEach(m=>{m.hp=Math.min(m.max,m.hp+1)});
  const def=busDef(S.station),bad=chance(Math.max(.12,.55-.12*def));let t='';
  const vm=rc();if(bad&&vm){const m=vm,n=def>=2?1:2;hurt(m,n,`Killed standing guard over ${who}.`);t=m.alive?` Something came in the night. ${m.name} held it off but took a hit (−${n} HP).`:` Something came in the night. ${m.name} didn't make it.`;
    if(m.alive&&def===0&&chance(.15)&&bite(m)){t+=` ${m.name} was bitten on the ${m.biteLimb}.`;log(`${m.name} was bitten on the ${m.biteLimb} standing guard.`,'bad')}}
  else t=def>=2?' Whoever was on the roof kept the night quiet.':' A long night, but nothing gets close.';
  Object.entries(pay).forEach(([k,v])=>gain(k,v));addNot(-1);bondTogether(alive(),3);
  return `You park up and keep watch over ${who} for a day and a night. Everyone rests (+1 HP).${t} In the morning they pay you: ${fmt(pay)}.`}
const stayOpt=(pay,who)=>({tag:'stay',label:'Stay a day and stand guard',hint:`A day passes (front +0.4) · they pay ${fmt(pay)} · notoriety −1 · a night watch: roof defense keeps it quiet`,run:()=>stayGuard(pay,who)});

  {tag:'help',label:'Get it out with your strongest',req:'Needs a Mechanic or Brawler',cond:()=>!!able(c=>c.trait==='Mechanic'||c.trait==='Brawler'),run:()=>{const m=able(c=>c.trait==='Mechanic'||c.trait==='Brawler');gain('fuel',2);addNot(-1);return `${m.name} has it rolling in two minutes. She gives you 2 fuel from a jerry can and a hand-drawn map of the back roads.`}},
  {tag:'help',label:'Tow it out with the bus',hint:'−1 fuel, light bus damage',cond:()=>S.res.fuel>=1,run:()=>{spend('fuel',1);const d=dmgRoad(1);gain('food',2);addNot(-1);return `The tow rope sings and the bumper groans (−${d} bus). She gives you 2 food.`}},
  {tag:'rob',label:'Siphon her tank instead',hint:'+3 fuel · notoriety +2',run:()=>{gain('fuel',3);addNot(2,'you stole from a stranded driver');return 'She screams at you the whole time. +3 fuel.'}},
  {tag:'leave',label:'Drive on',run:()=>'She doesn\'t even look up.'}]},
 {id:'pharmacist',title:'The pharmacist',text:()=>'An old pharmacist has barricaded himself behind his counter with a shotgun across his knees. The shelves behind him are still half full.',choices:[
  {tag:'help',label:'Trade 3 food for medicine',cond:()=>S.res.food>=3,run:()=>{spend('food',3);gain('meds',2);if(chance(.5))gain('morph',1);addNot(-1);return 'He counts out the boxes slowly, then adds something from under the counter. +2 meds, and maybe a morphine syrette.'}},
  {tag:'risk',label:'Sneak into the stockroom',req:'Needs a Scout, Ghost or Light-footed',cond:()=>!!able(c=>c.trait==='Scout'||c.quirk==='Ghost'||c.quirk==='Light-footed'),run:()=>{const m=able(c=>c.trait==='Scout'||c.quirk==='Ghost'||c.quirk==='Light-footed');if(chance(.65)){gain('meds',3);const av=chance(.3);if(av)gain('anti',1);return `${m.name} is in and out without a sound. +3 meds${av?' and a vial of antiviral':''}.`}hurt(m,2,'Shot by a pharmacist.');addNot(1,'you tried to steal from a pharmacist');return `A floorboard creaks. Buckshot catches ${m.name} on the way out (−2 HP).`}},
  {tag:'rob',label:'Hold him up',hint:'−2 ammo · notoriety +2',cond:()=>S.res.ammo>=2,run:()=>{spend('ammo',2);addNot(2,'you robbed an old pharmacist at gunpoint');if(chance(NOT()>=5?.45:.7)){gain('meds',4);if(chance(.35))gain('anti',1);return 'He drops the shotgun. You take everything worth taking. +4 meds.'}const m=rc();hurt(m,2,'Shot by a pharmacist.');gain('meds',1);return `He fires first. ${m.name} goes down hard (−2 HP). You grab one box on the way out.`}},
  {tag:'leave',label:'Leave quietly',run:()=>'He doesn\'t lower the shotgun until you\'re gone.'}]},
 {id:'radio',title:'Kid with a ham radio',text:()=>'A university student on a rooftop is running a ham radio off a car battery. He has been tracking the herd, but his antenna is wrecked.',choices:[
  {tag:'help',label:'Fix his antenna',req:'Needs a Mechanic or Handy',cond:()=>!!able(c=>c.trait==='Mechanic'||c.quirk==='Handy'),run:()=>{const m=able(c=>c.trait==='Mechanic'||c.quirk==='Handy');S.front=Math.max(-5,S.front-.3);gain('research',2);addNot(-1);return `${m.name} rebuilds it from a TV aerial. He reads you the herd's position: you find a shortcut. Front −0.3 days, +2 research.`}},
  {tag:'help',label:'Give him 1 part',cond:()=>S.res.parts>=1,run:()=>{spend('parts',1);S.front=Math.max(-5,S.front-.3);addNot(-1);return 'He gets a signal back and relays the herd\'s heading. You take a smarter road. Front −0.3 days.'}},
  {tag:'rob',label:'Take the radio and battery',hint:'+2 parts, +2 research · notoriety +2',run:()=>{gain('parts',2);gain('research',2);addNot(2,'you stripped a kid\'s radio');return 'He follows you down the stairs, begging. +2 parts, +2 research.'}},
  {tag:'help',label:'Promise to look for his sister',hint:'Quest: she was last heard from a few stops ahead',run:()=>'Her name is Aina. She was at her school when the calls stopped.'+addQuest('sister')},
  {tag:'leave',label:'Wish him luck',run:()=>'He\'s already back on the mic as you leave.'}]},
 {id:'rice',title:'Farmers loading rice',text:()=>'A family is loading sacks of rice onto a lorry, heading inland. They\'re slow, and the sun is going down.',choices:[
  {tag:'help',label:'Help them load',hint:'Brawlers make it quick',run:()=>{const b=able(isT('Brawler'));addNot(-1);if(b){gain('food',4);return `${b.name} throws sacks like pillows. They give you 4 food.`}S.front+=.2;gain('food',3);return 'It takes everyone an hour (the front gains a little). They give you 3 food.'}},
  {tag:'help',label:'Trade 2 ammo for 5 food',cond:()=>S.res.ammo>=2,run:()=>{spend('ammo',2);gain('food',5);return 'A fair deal. They even help you stack it.'}},
  {tag:'rob',label:'Take a load of rice',hint:'+6 food · notoriety +2 · they may fight',run:()=>{gain('food',6);addNot(2,'you robbed farmers fleeing inland');if(chance(NOT()>=5?.5:.3)){const m=rc();hurt(m,2,'Beaten by farmers.');return `The father swings a changkul. ${m.name} takes it on the arm (−2 HP). You still get 6 food.`}return 'They don\'t fight. +6 food.'}},
  {tag:'leave',label:'Leave them to it',run:()=>'Their lorry passes you later, heading the other way.'}]},
 {id:'brother',title:'A bitten brother',text:()=>'A man is half-carrying his younger brother, whose forearm is wrapped in a bloody shirt. He begs you for antiviral. A hunting rifle is slung over his back.',choices:[
  {tag:'help',label:'Give them antiviral',cond:()=>S.res.anti>=1,run:()=>{spend('anti',1);addNot(-2);gain('ammo',4);return 'He weeps. He gives you every round he has (+4 ammo) and swears he\'ll tell everyone what you did.'}},
  {tag:'help',label:'Your Medic takes the arm',req:'Needs a Medic and 1 morphine',cond:()=>!!able(isT('Medic'))&&S.res.morph>=1,run:()=>{const m=able(isT('Medic'));spend('morph',1);addNot(-1);if(chance(.6)){gain('ammo',3);return `${m.name} works fast. The brother will live. +3 ammo from a grateful family.`}return `${m.name} tries, but the fever has already started. The brother asks you to go.`}},
  {tag:'rob',label:'Take his rifle while he\'s distracted',hint:'Notoriety +3',run:()=>{addGear('rifle',rollCond(1));addNot(3,'you stole from a man burying his brother');return 'You take it from his back while he kneels. He doesn\'t even try to stop you.'}},
  {tag:'leave',label:'Tell them you have nothing',run:()=>'You hear the shot a few minutes after you leave.'}]},
 {id:'police',title:'Locked police post',text:()=>'A balai polis with the shutters down and a padlocked gate. Something inside bangs against the door now and then.',choices:[
  {tag:'risk',label:'Pick the lock quietly',hint:'Mechanics and Handy crew do better',run:()=>{const h=able(c=>c.trait==='Mechanic'||c.quirk==='Handy');if(chance(h?.75:.5)){gain('ammo',4);let t='+4 ammo from the armoury.';if(chance(.35)){const g=pick(['pistol','shotgun','crowbar']);addGear(g,rollCond(1));t+=` And a ${gearOf(g).name.toLowerCase()}.`}return t}const m=rc();hurt(m,2,'Killed at a police post.');let t=`A constable in a torn uniform lunges out. ${m.name} takes a hit (−2 HP).`;if(m.alive&&chance(.25)&&bite(m))t+=` ${m.name} is bitten on the ${m.biteLimb}.`;return t}},
  {tag:'risk',label:'Shoot the lock off',hint:'−2 ammo, loud: the front gains on you',cond:()=>S.res.ammo>=2,run:()=>{spend('ammo',2);S.front+=.2;gain('ammo',5);gain('meds',1);return 'The gunshot echoes off every shophouse. Worth it: +5 ammo, +1 meds.'}},
  {tag:'leave',label:'Leave it locked',run:()=>'Whatever is inside keeps knocking.'}]},
 {id:'rivals',title:'Another group with a flat',text:()=>'A van with a shredded tyre. Four survivors with parangs, one with a pistol. They size up your bus the way you size up theirs.',choices:[
  {tag:'help',label:'Patch their tyre',req:'Needs a Mechanic or 2 parts',cond:()=>!!able(isT('Mechanic'))||S.res.parts>=2,run:()=>{if(!able(isT('Mechanic')))spend('parts',2);gain('fuel',3);addNot(-1);return 'They share 3 fuel and warn you about a roadblock ahead. You drive a little easier.'}},
  {tag:'rob',label:'Rob them',hint:'−3 ammo, a fight · notoriety +2',cond:()=>S.res.ammo>=3,run:()=>{spend('ammo',3);addNot(2,'you robbed another survivor group');gain('fuel',4);gain('food',2);let t='+4 fuel, +2 food.';alive().forEach(m=>{if(chance(NOT()>=5?.35:.25)){hurt(m,2,'Killed robbing survivors.');t+=` ${m.name} is hurt.`}});return 'They fight back. '+t}},
  {tag:'leave',label:'Nod and move on',run:()=>'Both groups keep their hands on their weapons until you\'re out of sight.'}]},
 {id:'elders',title:'They won\'t leave',text:()=>'An elderly couple sit on the steps of their kampung house. They refuse to leave the graves of their children. Their store room is full.',choices:[
  {tag:'help',label:'Leave them 2 food',cond:()=>S.res.food>=2,run:()=>{spend('food',2);gain('fuel',2);addNot(-1);return 'The old man tells you where the village hid its diesel. +2 fuel.'}},
  {tag:'help',label:'Escort them to the longhouse upriver',req:'Needs a Scout',cond:()=>!!able(isT('Scout')),run:()=>{const m=able(isT('Scout'));S.front+=.2;addNot(-2);gain('food',3);return `${m.name} walks them there through the rubber trees (the front gains a little). The longhouse sends back 3 food.`}},
  {tag:'rob',label:'Clear out their store room',hint:'+3 food, +2 fuel · notoriety +2',run:()=>{gain('food',3);gain('fuel',2);addNot(2,'you robbed an old couple');return 'They don\'t move from the steps. +3 food, +2 fuel.'}},
  {tag:'leave',label:'Wish them peace',run:()=>'They wave until you\'re round the bend.'}]},
 {id:'gas',title:'Night market gas tanks',text:()=>'The night market stalls are abandoned, but there are LPG tanks under every one, and some still have their pressure.',choices:[
  {tag:'risk',label:'Haul the full ones',hint:'+2 fuel, +1 part, might go wrong',run:()=>{gain('fuel',2);gain('parts',1);if(chance(.25)){const d=dmgRoad(2);return `One rolls off the roof and ruptures by the engine (−${d} bus). You still have +2 fuel, +1 part.`}return '+2 fuel, +1 part. Everyone drives with the windows open.'}},
  {tag:'leave',label:'Leave them',run:()=>'Not worth the risk.'}]},
 {id:'soldier',title:'A dying soldier',text:()=>'A soldier sits against a mile marker, grey in the face, rifle across his lap. Before his unit was overrun, he says, they buried a cache.',choices:[
  {tag:'help',label:'Give him 1 meds and listen',cond:()=>S.res.meds>=1,run:()=>{spend('meds',1);addNot(-1);return 'He draws the spot on your hand in biro.'+addQuest('cache')}},
  {tag:'help',label:'Let your Medic ease his pain',req:'Needs a Medic',cond:()=>!!able(isT('Medic')),run:()=>{const m=able(isT('Medic'));addNot(-1);return `${m.name} sits with him to the end. He tells you exactly where to dig.`+addQuest('cache')}},
  {tag:'rob',label:'Take his rifle and go',hint:'Notoriety +2',run:()=>{addGear('rifle',rollCond(1));addNot(2,'you robbed a dying soldier');return 'He doesn\'t have the strength to stop you.'}},
  {tag:'leave',label:'Leave him in peace',run:()=>'You leave him a bottle of water. He salutes, badly.'}]},
 {id:'son',title:'A son on a kapchai',text:()=>'A young man on a motorbike pulls up beside the bus. His father is diabetic, stuck at home further down the road, and out of medicine. He can\'t go back alone.',choices:[
  {tag:'help',label:'Promise to bring medicine',hint:'Quest: needs 2 meds when you get there',run:()=>'He draws you a map to the house on a cigarette packet.'+addQuest('son')},
  {tag:'rob',label:'Siphon his tank',hint:'+2 fuel · notoriety +2',run:()=>{gain('fuel',2);addNot(2,'you robbed a boy trying to save his father');return 'He pushes the bike away in silence.'}},
  {tag:'leave',label:'Tell him you can\'t',run:()=>'He rides off toward the hills.'}]},
 {id:'mamak',title:'The last mamak stall',text:()=>'Somehow the mamak stall on the corner is still frying. The owner is flipping roti with one eye on the street and a parang beside the griddle. "Watch my back while I pack the van and I\'ll feed you all."',choices:[
  {tag:'help',label:'Stand guard while he packs',hint:'Brawlers keep it quiet',run:()=>{const b=able(isT('Brawler'));addNot(-1);if(b||chance(.65)){gain('food',4);return `${b?b.name+' plants themselves in the road and nothing gets close.':'A couple of them wander up, but you see them off.'} He loads you up with roti and teh tarik in plastic bags. +4 food.`}const m=rc();hurt(m,1,'');gain('food',3);return `One gets a hand on ${m.name} before you drop it (−1 HP). He still gives you 3 food.`}},
  {tag:'help',label:'Pay 1 ammo for a proper meal',cond:()=>S.res.ammo>=1,run:()=>{spend('ammo',1);alive().forEach(m=>m.hp=Math.min(m.max,m.hp+1));gain('food',1);return 'Everyone eats hot food sitting on plastic stools. Everyone +1 HP, and he wraps up an extra portion.'}},
  {tag:'rob',label:'Take his rice and his gas tank',hint:'+5 food, +1 fuel · notoriety +2',run:()=>{gain('food',5);gain('fuel',1);addNot(2,'you robbed a mamak stall');return 'He swears at you in three languages. +5 food, +1 fuel.'}},
  {tag:'leave',label:'Wave and drive on',run:()=>'He waves the spatula back.'}]},
 {id:'fishermen',title:'Boat with a dead engine',text:()=>'Two fishermen are pushing a sampan off the beach. The outboard won\'t start, and the tide is turning. Behind them, the kampung is quiet in the wrong way.',choices:[
  {tag:'help',label:'Get the outboard running',req:'Needs a Mechanic or Handy',cond:()=>!!able(c=>c.trait==='Mechanic'||c.quirk==='Handy'),run:()=>{const m=able(c=>c.trait==='Mechanic'||c.quirk==='Handy');gain('food',3);gain('fuel',1);addNot(-1);return `${m.name} cleans the plug with a shirt and it coughs into life. They leave you dried fish and a can of two-stroke. +3 food, +1 fuel.`}},
  {tag:'help',label:'Help them drag it to the water',hint:'+2 food · notoriety −1 · takes a while (front +0.2) · 50%: someone −1 HP',run:()=>{const m=rc();const hit=chance(.5);if(hit)hurt(m,1,'');gain('food',2);addNot(-1);S.front+=.2;return `It takes everyone and most of an hour.${hit?` ${m.name} gets a hull edge across the shin (−1 HP).`:''} They paddle off, throwing you 2 food from the boat.`}},
  {tag:'rob',label:'Take their fuel can',hint:'+3 fuel · notoriety +2',run:()=>{gain('fuel',3);addNot(2,'you stranded two fishermen');return 'They watch you go, standing in the shallows.'}},
  {tag:'leave',label:'Leave them to it',run:()=>'Later you see a sail on the horizon. Maybe it was them.'}]},
 {id:'church',title:'Families in the church hall',text:()=>'A pastor has barred the church hall doors with pews. Inside, a dozen families. He asks for medicine, nothing else, and he won\'t let you in.',choices:[
  {tag:'help',label:'Pass 1 meds through the window',cond:()=>S.res.meds>=1,run:()=>{spend('meds',1);gain('food',2);addNot(-1);return 'A small hand takes it. The pastor passes back a bag of biscuits and a promise to pray for the bus. +2 food.'}},
  {tag:'help',label:'Sort out their medicine cabinet',req:'Needs a Medic or Pharmacist',cond:()=>!!able(c=>c.trait==='Medic'||c.quirk==='Pharmacist'),run:()=>{const m=able(c=>c.trait==='Medic'||c.quirk==='Pharmacist');gain('meds',1);gain('morph',1);addNot(-1);return `${m.name} talks them through what they've got. Half of it is expired; the rest they share. +1 meds, +1 morphine.`}},
  {tag:'risk',label:'Search the bell tower for supplies',hint:'Something might be up there',run:()=>{if(chance(.55)){gain('parts',2);gain('ammo',2);return 'Someone stashed a tool bag and a box of rounds up by the bell. +2 parts, +2 ammo.'}const m=rc();hurt(m,2,'Killed in a bell tower.');let t=`The verger is still up there. He isn't the verger any more. ${m.name} takes a hit (−2 HP).`;if(m.alive&&chance(.2)&&bite(m))t+=` ${m.name} is bitten on the ${m.biteLimb}.`;return t}},
  {tag:'leave',label:'Leave them in peace',run:()=>'You hear singing through the walls as you leave.'}]},
 {id:'lift',title:'Stuck in a lift',text:()=>'Banging from a shophouse lift shaft. The power is out and someone is trapped between floors. The lobby downstairs isn\'t empty.',choices:[
  {tag:'help',label:'Hand-crank the lift down',req:'Needs a Mechanic or Handy',cond:()=>!!able(c=>c.trait==='Mechanic'||c.quirk==='Handy'),run:()=>{const m=able(c=>c.trait==='Mechanic'||c.quirk==='Handy');gain('fuel',4);addNot(-1);return `${m.name} finds the manual release in the motor room. The man inside is a lorry driver; he gives you his tank. +4 fuel.`}},
  {tag:'risk',label:'Force the doors on his floor',hint:'Loud, the lobby will hear',run:()=>{const b=able(isT('Brawler'));if(b||chance(.5)){gain('fuel',3);addNot(-1);return `${b?b.name+' wrenches the doors apart.':'The doors give with a bang.'} He's out, shaking, and insists you take his fuel. +3 fuel.`}const m=rc();hurt(m,2,'Killed on a shophouse stairwell.');gain('fuel',2);return `The noise brings the lobby up the stairs. You get him out, but ${m.name} is hurt (−2 HP). +2 fuel.`}},
  {tag:'leave',label:'You can\'t risk it',run:()=>'The banging follows you down the street.'}]},
 {id:'tamu',title:'What\'s left of the tamu',text:()=>'The Sunday tamu is mostly overturned tables, but one auntie is still at her stall, selling tapai and dried fish to anyone with something to trade.',choices:[
  {tag:'help',label:'Trade 2 ammo for 4 food',cond:()=>S.res.ammo>=2,run:()=>{spend('ammo',2);gain('food',4);return 'She counts the rounds twice and gives you a good weight.'}},
  {tag:'help',label:'Chat with her in Dusun',req:'Needs someone who speaks Dusun',cond:()=>!!able(c=>bgOf(c)==='dusun'),run:()=>{const m=able(c=>bgOf(c)==='dusun');gain('food',3);gain('morph',chance(.4)?1:0);addNot(-1);return `${m.name} and the auntie turn out to have a cousin in common. She won't take anything for it, and slips in a little extra from under the table. +3 food.`}},
  {tag:'rob',label:'Grab what you can and run',hint:'Notoriety +2 · her screaming draws them',run:()=>{gain('food',4);addNot(2,'you robbed an old woman at the tamu');let t='+4 food.';if(chance(.5)){const m=rc();hurt(m,1,'');t+=` Her shouting brings a few of them out of the stalls. ${m.name} gets clawed (−1 HP).`}return t}},
  {tag:'leave',label:'Buy nothing',run:()=>'She calls after you about the price of rice.'}]},
 {id:'estate',title:'Oil palm estate lorry',text:()=>'Estate workers have a lorry loaded with diesel drums at the edge of the plantation. They\'re armed and nervous, waiting for a driver who isn\'t coming.',choices:[
  {tag:'help',label:'Trade 3 food for 4 fuel',cond:()=>S.res.food>=3,run:()=>{spend('food',3);gain('fuel',4);return 'Fair, and fast. Nobody wants to stand around out here.'}},
  {tag:'help',label:'Your Driver gets the lorry out for them',req:'Needs a Driver',cond:()=>!!able(isT('Driver')),run:()=>{const m=able(isT('Driver'));gain('fuel',5);S.front+=.1;addNot(-1);return `${m.name} takes the lorry down the estate road to the highway, with your bus behind. They pay in diesel. +5 fuel.`}},
  {tag:'rob',label:'Take the drums at gunpoint',hint:'−3 ammo · notoriety +2 · they may shoot',cond:()=>S.res.ammo>=3,run:()=>{spend('ammo',3);gain('fuel',6);addNot(2,'you held up estate workers');let t='+6 fuel.';if(chance(NOT()>=5?.5:.3)){const m=rc();hurt(m,2,'Shot by estate workers.');t+=` One of them fires anyway. ${m.name} is hit (−2 HP).`}return 'They back off slowly. '+t}},
  {tag:'leave',label:'Not your problem',run:()=>'They watch the road for their driver.'}]},
 {id:'dog',title:'A dog under the rubble',text:()=>'A collapsed carport, and under it a muddy brown dog with its leg pinned, barking itself hoarse. Every bark carries down the street.',choices:[
  {tag:'help',label:'Dig it out',hint:'The barking is drawing them in',run:()=>{if(chance(.7)){S.dog='Rimau';log('Rimau the dog has joined the bus. Fewer surprises on the road, and an extra guard on the roof.','good');return 'It takes ten minutes and two of you. The dog limps out, sniffs everyone, and gets on the bus like it owns it. You call it Rimau. Rimau keeps watch from the roof: fewer road events, and the bus is better defended.'}const m=rc();hurt(m,1,'');return `They arrive before you finish. You get the dog free, but it bolts into the trees, and ${m.name} is scratched getting away (−1 HP).`}},
  {tag:'leave',label:'Leave it',run:()=>'The barking stops a few streets later. You try not to think about why.'}]},
 {id:'deserter',title:'A soldier on the shoulder',text:()=>'A young soldier with no unit badge stands on the road shoulder with his thumb out and a rifle on his back. He wants a lift to the next town and won\'t say where his unit is.',choices:[
  {tag:'help',label:'Give him a lift',hint:'He pays for the ride',run:()=>{spend('food',Math.min(S.res.food,1));if(chance(.75)){addGear('rifle',rollCond(1));return 'He sits by the door the whole way and doesn\'t sleep. At the next town he leaves you his rifle. "I\'m done with it."'}return 'He jumps off at a junction without a word, and takes a bag of food with him.'}},
  {tag:'help',label:'Have your Medic check him over first',req:'Needs a Medic',cond:()=>!!able(isT('Medic')),run:()=>{const m=able(isT('Medic'));addGear('rifle',rollCond(1));gain('ammo',3);return `${m.name} finds he's clean, and finds the shakes. He gives you the rifle and his spare rounds: "Better you than me." +3 ammo.`}},
  {tag:'rob',label:'Take his rifle',hint:'Notoriety +1 · he might fight',run:()=>{addNot(1,'you disarmed a soldier on the road');if(chance(.6)){addGear('rifle',rollCond(1));return 'He doesn\'t fight. He looks relieved.'}const m=rc();hurt(m,2,'Shot by a deserter.');return `He gets a shot off first. ${m.name} is hit (−2 HP) and he runs into the trees with the rifle.`}},
  {tag:'leave',label:'Drive past',run:()=>'In the mirror he lowers his thumb and starts walking.'}]},
 {id:'mural',title:'A map on the wall',text:()=>'Someone has painted a huge map of the district on a shophouse wall, with the herd\'s movements marked day by day in red. The newest marks are near the top, three storeys up.',choices:[
  {tag:'help',label:'Have your Scout read it from the roof opposite',req:'Needs a Scout or Hawk-eyed',cond:()=>!!able(c=>c.trait==='Scout'||c.quirk==='Hawk-eyed'),run:()=>{const m=able(c=>c.trait==='Scout'||c.quirk==='Hawk-eyed');S.front=Math.max(-5,S.front-.4);return `${m.name} copies it all down. You re-plan around the herd's path. The front loses ground.`}},
  {tag:'risk',label:'Climb the drainpipe to read the top',hint:'Might fall',run:()=>{const m=rc();if(chance(.65)){S.front=Math.max(-5,S.front-.3);return `${m.name} makes it up and reads off the newest marks. The front loses ground.`}hurt(m,2,'Fell from a drainpipe.');return `The pipe tears off the wall. ${m.name} lands hard (−2 HP).`}},
  {tag:'leave',label:'Take a photo and go',run:()=>'The bottom half is weeks old. It doesn\'t tell you much.'}]},
 {id:'grudge',special:true,title:'They know the bus',text:()=>`Men with parangs step out across the road and a horn blares from the rooftops. Your bus is ${notLv()[1].toLowerCase()} here.`,choices:[
  {tag:'help',label:'Talk them down with 3 food',cond:()=>S.res.food>=3,run:()=>{spend('food',3);addNot(-1);return 'It takes a long time and all your food. They let you be, this once.'}},
  {tag:'risk',label:'Fight your way out',hint:'−2 ammo, people may get hurt',cond:()=>S.res.ammo>=2,run:()=>{spend('ammo',2);let t='';alive().forEach(m=>{if(chance(.35)){hurt(m,2,'Killed by angry locals.');t+=` ${m.name} is hurt.`}});addNot(1,'you shot your way out of a kampung');return 'It turns ugly fast.'+(t||' Nobody on your side is badly hurt.')}},
  {tag:'leave',label:'Back off to the bus',hint:'They take a parting shot at the bus',run:()=>{const d=dmgRoad(1);return `Rocks and a bottle hit the windows as you leave (−${d} bus).`}}]}
];
Object.entries(STAYS).forEach(([id,[pay,who]])=>{const e=ENCS.find(x=>x.id===id);if(e){const i=e.choices.findIndex(c=>c.tag==='leave');e.choices.splice(i<0?e.choices.length:i,0,stayOpt(pay,who))}});

const scavIds=P=>P.order.filter(id=>P.roles[id]==='scav');
const usedBy=(P,id,k)=>scavIds(P).filter(o=>o!==id).reduce((s,o)=>s+(P.loads[o]?P.loads[o][k]:0),0);
const canWield=(m,w)=>!(gearOf(w).two&&m.lost.includes('arm'));
function freeWeapon(P,id,slot,pref){
  const m=byId(id);
  const taken=scavIds(P).filter(o=>o!==id).map(o=>P.loads[o]&&P.loads[o][slot]);
  const list=slot==='melee'?[...S.gear.melee]:['none',...S.gear.ranged];{const i=S.rack?list.indexOf(S.rack[slot]):-1;if(i>=0&&list[i]!=='none'&&list[i]!=='knife')list.splice(i,1)}
  const ok=w=>list.includes(w)&&canWield(m,w)&&(w==='knife'||w==='none'||!taken.includes(w));
  if(pref&&ok(pref))return pref;
  return (slot==='melee'?['axe','parang','crowbar','knife']:['rifle','shotgun','pistol','crossbow','none']).find(ok)||(slot==='melee'?'knife':'none');
}
function defaultLoad(P,id){
  const ll=S.lastLoads[id]||{};
  const L={melee:'knife',ranged:'none',ammo:0,meds:0,traps:0,lure:0};P.loads[id]=L;
  L.melee=freeWeapon(P,id,'melee',ll.melee);L.ranged=freeWeapon(P,id,'ranged',ll.ranged);
  const room=k=>S.res[k]-usedBy(P,id,k);
  L.ammo=Math.min(room('ammo'),ll.ammo??(L.ranged==='none'?0:4));
  L.meds=Math.min(room('meds'),ll.meds??1);
  L.traps=Math.min(room('traps'),ll.traps??1);
  L.lure=Math.min(room('lure'),ll.lure??1);
}

    if(c.aware&&c.kind==='screamer'){rmsg('It shrieks.','bad');crNoise(5)}

  else if(c.t==='bar')rmsg(c.heavy?`Heavy barricades and steel grilles: a sealed ${c.secure==='army'?'armoury':'hospital ward'}. This will take work.`:'A shop boarded up tight. Nobody has been in since it started.','warn');
  else if(c.t==='empty'){c.done=true;rmsg('Someone got here first. Picked clean.')}
  else if(c.t==='ev'){c.done=true;const E=CEV.find(e=>e.id===c.ev);rmsg(E.txt);E.fx(r,s)}
  else if(c.t==='help'){rmsg('Someone is banging on a locked back room, shouting for help. Two of them are clawing at the door.','warn');for(let i=0;i<2;i++){const z=mkZc(zKind(r.col,r.site.danger),true,false);z.help=true;r.cards.push(z)}}
  if(c.t==='z'||c.t==='help')ui.csel=ci;else if(c.t==='ev'&&r.lastGot&&listItems(r.lastGot))c.res='+'+listItems(r.lastGot).replace(/, /g,' +');
  if(nr)crDark();if(!crIn().length){crLeave(true);return}save();render()}
function crAbility(){const r=S.raid,s=crS();if(!s)return;ui.csel=null;const m=memOf(s);if(r.uses[m.id])return;const th=crThreats();
  if(m.trait==='Medic'){crHere().forEach(o=>{const q=memOf(o);q.hp=Math.min(q.max,q.hp+2)});rmsg(`${m.name} does a round of triage. +2 HP each.`,'good')}
  else if(m.trait==='Scout'){r.peek=true;rmsg(`${m.name} climbs up for a look. You can see what's under every card, until the next flip.`,'good')}
  else if(m.trait==='Mechanic'){if(!th.length)return;crLureOff(th[0],`${m.name} tosses a rigged alarm. The ${ZK[th[0].kind].name.toLowerCase()} goes after it.`)}
  else if(m.trait==='Driver'){if(!th.length)return;th.slice(0,2).forEach(c=>crLureOff(c,`${m.name} hot-wires a car horn down the street. It pulls them away.`));crNoise(2)}
  else if(m.trait==='Brawler'){if(!th.length)return;th.forEach(c=>c.stun=1);rmsg(`${m.name} shoves them back. Next hit on each gets no reply.`,'good')}
  else return;r.uses[m.id]=1;AUD.play('good');save();render()}
function crBandage(){const s=crS();if(!s||!(S.res.meds>0))return;const m=memOf(s);if(m.hp>=m.max)return;spend('meds',1);
  const h=(m.trait==='Medic'?2:1)+(m.healBonus||0)+kitVal(m,'heal')+(hasSk(m,'fieldmedic')?1:0);m.hp=Math.min(m.max,m.hp+h);AUD.play('pickup');rmsg(`${m.name} bandages up (+${h} HP).`,'good');save();render()}
function crRush(drop){const th=crThreats(),Z=th.filter(c=>c.aware).length+.5*th.filter(c=>!c.aware).length,C=Math.max(1,crHere().length);return Math.max(.05,Math.min(.9,(.1+.14*Z-.04*(C-1))*(drop?.5:1)))}
function crLeave(forced,mode){const r=S.raid;
  if(!forced&&crThreats().length){const drop=mode==='drop',p=crRush(drop),th=crThreats();
    if(drop)crHere().forEach(s=>{if(s.slots>0){rmsg(`${memOf(s).name} drops ${listItems(s.pack)} and runs.`,'warn');s.pack={};s.slots=0}});
    crHere().forEach(s=>{const m=memOf(s);if(!chance(p))return;const c=pick(th);crZHit(s,c,'Running for the bus, one catches')});}
  r.party.forEach(s=>{if(s.state==='in'&&memOf(s).alive)s.state='out';else if(s.state==='in')s.state='dead'});endRaid()}

/* ---------- card siege: three sides of the bus, round by round ---------- */
const LANES=['Front door','Side windows','Back of the bus'];
function startCardSiege(r){const g=r.siege;r.party.forEach(p=>{Object.entries(p.pack).forEach(([k,v])=>{if(!k.startsWith('gear:')&&!k.startsWith('kit:'))gain(k,v)});p.pack={}});
  const cr=r.site.crates.map((c,i)=>({loot:c.loot,far:i===0?2:1,taken:false}));
  Object.assign(r,{card:'siege',round:0,rounds:g.deep?8:5,lanes:LANES.map(()=>[]),asg:{},errands:[],out:cr,rackLane:0});
  r.party.forEach((s,i)=>{r.asg[s.mid]=i%3;s.fire=crGunOk(s)});
  S.raid=r;S.screen='raid';ui.modal=null;ui.plan=null;csSpawn(g.deep?4:2);
  rmsg(g.deep?`They are coming from every direction. Hold for ${r.rounds} rounds.`:`The front is on you. Hold the bus for ${r.rounds} rounds while the wave passes.`,'bad');
  rmsg('Tap a person, then a side of the bus to put them there. Empty sides get the bus torn at. There is fuel out there too, if you can spare someone to fetch it.','warn');
  save();render()}
function csSpawn(n){const r=S.raid;for(let i=0;i<n;i++){const k=zKind(r.col,r.site.danger);r.lanes[rnd(0,2)].push({kind:k,hp:ZK[k].hp})}}
function csRound(extra){const r=S.raid,g=r.siege;let busHit=0;r.party.forEach(p=>p.stam=Math.min(100,(p.stam||0)+20));
  r.lanes.forEach((L,li)=>{const def=crIn().filter(s=>r.asg[s.mid]===li&&!r.errands.some(e=>e.mid===s.mid));
    if((r.traps||[])[li]>0&&L[0]){const z=L.shift();r.traps[li]--;S.stats.kills++;AUD.play('trap');rmsg(`A trap at the ${LANES[li].toLowerCase()} snaps shut on a ${ZK[z.kind].name.toLowerCase()}.`,'good')}
    const strike=(dmg,by,gun)=>{const z=L[0];if(!z)return;z.hp-=gun?dmg:Math.max(1,dmg-(ZK[z.kind].armor||0));if(z.hp<=0){L.shift();S.stats.kills++;if(by)addXp(by,1+(z.kind==='brute'||z.kind==='soldier'?2:z.kind==='walker'?0:1))}};
    def.forEach(s=>{const m=memOf(s);if(s.fire&&crGunOk(s)){const G=GM(s.load.ranged),C=condOf(s.load.ranged);spend('ammo',1);if(chance(G.hit+C.hit))strike(G.dmg+C.dmg,m,true)}
      else{const {d}=crMeleeDmg(s,'walker');strike(d,m)}});
    if(def.length&&li===r.rackLane&&S.rack){if(S.rack.ranged!=='none'&&S.rack.ammo>0){const G=GM(S.rack.ranged);S.rack.ammo--;if(chance(G.hit))strike(G.dmg,null,true)}else if(S.rack.melee&&S.rack.melee!=='none')strike(MELEE[S.rack.melee].dmg,null)}
    L.forEach(z=>{const Z=ZK[z.kind];if(def.length){if(chance(.12)){const s=pick(def),m=memOf(s);if(chance(Z.bite*.4*(m.quirk==='Thick-skinned'?.5:1)*(hasSk(m,'ironhide')?.5:1)))bite(m);hurt(m,Z.dmg,`Killed holding the bus at ${node(r.node).name}.`);rmsg(`A ${Z.name.toLowerCase()} gets hold of ${m.name} at the ${LANES[li].toLowerCase()}.`,'bad');ui.hitMid=m.id;buzz(60);if(!m.alive)s.state='dead'}}else if(chance(.6)){busHit+=Z.dmg}})});
  if(busHit){dmgTruck(busHit);rmsg(`Nobody's covering every side. The bus takes ${busHit} damage.`,'bad');if(S.screen==='end')return}
  r.errands=r.errands.filter(e=>{const s=r.party.find(p=>p.mid===e.mid),m=memOf(s);if(s.state!=='in'||!m.alive)return false;
    if(chance(g.deep?.3:.18)){hurt(m,1,`Killed out past the bus at ${node(r.node).name}.`);rmsg(`${m.name} runs into one out there. −1 HP.`,'bad');if(!m.alive){s.state='dead';return false}}
    if(--e.left>0)return true;const o=r.out[e.i];o.taken=true;const [k,a]=o.loot;s.pack[k]=(s.pack[k]||0)+a;rmsg(`${m.name} makes it back with ${a} ${resLabel(k).toLowerCase()}.`,'good');AUD.play('good');return false});
  if(!g.done){r.round++;if(r.round>=r.rounds){g.done=true;AUD.play('good');rmsg('The wave breaks. Depart when everyone is back.','good')}else csSpawn((g.deep?3:2)+Math.floor(r.col/3)+(r.round>r.rounds/2?1:0))}
  else csSpawn(extra||1);
  if(!crIn().length){if(alive().length)endRaid();else{S.raid=null;checkEnd()}return}save();render()}
function csDepart(){const r=S.raid;if(!r.siege.done)return;const gone=r.errands.map(e=>memOf(r.party.find(p=>p.mid===e.mid)));
  if(gone.length&&ui.confirm!=='depart'){ui.confirm='depart';rmsg(`${gone.map(m=>m.name).join(' and ')} ${gone.length>1?'are':'is'} still out there. Tap Depart again to leave without them.`,'bad');render();return}
  ui.confirm=null;r.party.forEach(s=>{const m=memOf(s);if(s.state!=='in')return;if(r.errands.some(e=>e.mid===s.mid)){m.alive=false;S.stats.lost++;s.state='dead';log(`${m.name} was left behind at ${node(r.node).name} when the bus pulled out.`,'bad');morLeftBehind(m.name)}else s.state=m.alive?'out':'dead'});
  log(`Held the bus at ${node(r.node).name} against the ${r.siege.deep?'deep front':'front'} and pulled out.`,'good');endRaid()}

function crCrewRow(siege){const r=S.raid,sel=crS();
  return `<div class="crrow">${r.party.map((s,i)=>{const m=memOf(s);if(!m)return '';const run=!siege&&crAway(s),dead=s.state!=='in'||!m.alive,on=sel===s,away=siege&&r.errands.some(e=>e.mid===s.mid);

function crCard(c,i,blocked){const r=S.raid,fl=ui.flipI===i?' just':'',sel=ui.csel===i?' sel':'',res=c.res?`<span class="cres">${esc(c.res)}</span>`:'';
  if(!c.up){const peek=r.peek?`<span class="cg">${CGLYPH[c.t]}</span><span class="small">${c.t==='z'?ZK[c.kind].name:CNAME[c.t]}</span>`:'<span class="cg">?</span>';

  if(c.t==='bar'){if(c.open)return `<div class="ccard up done${fl}"><span class="cg">▦</span><span class="small">${c.heavy?'Broken into':'Opened'}</span>${res}</div>`;
    return `<button class="ccard up bar ${c.heavy?'heavy':''}${fl}${sel}" data-a="csel" data-arg="${i}"><span class="cg">${c.heavy?(c.secure==='army'?'★':'✚'):'▦'}</span><b>${c.heavy?(c.secure==='army'?'Armoury':'Sealed ward'):'Boarded shop'}</b><span class="small dim">${c.heavy?'heavy boards':'untouched'}</span>${res}<span class="tapme">tap to open</span></button>`}
  if(c.t==='help'){const left=r.cards.filter(o=>o.help&&!o.done).length;if(c.freed)return `<div class="ccard up done${fl}"><span class="cg">!</span><span class="small">Rescued</span>${res}</div>`;
    return `<button class="ccard up help${fl}${sel}" data-a="csel" data-arg="${i}"><span class="cg">!</span><b>Trapped</b><span class="small dim">${left?`${left} at the door`:'door is clear'}</span><span class="tapme">tap</span></button>`}
  if((c.t==='loot'||c.t==='stash')&&!c.done)return `<button class="ccard up loot${fl}${sel}" data-a="csel" data-arg="${i}"><span class="cg" style="color:var(--amber)">${c.t==='stash'?'★':'▣'}</span><b>${c.t==='stash'?'The stash':'Supplies'}</b><span class="small dim">packs full</span><span class="tapme">tap to take</span></button>`;
  if(c.t==='stash')return `<div class="ccard up done stashc${fl}"><span class="cg" style="color:var(--amber)">★</span><span class="small">Stash</span>${res}</div>`;

function crLog(){return `<div class="crlog">${S.raid.msgs.slice(0,5).map((m,i)=>`<div class="${m.k}" style="opacity:${1-i*.15}">${esc(m.t)}</div>`).join('')}</div>`}
function crIntel(){return Math.max(0,...crIn().map(s=>{const m=memOf(s);return m.lv+(m.trait==='Scout'?3:0)+(m.quirk==='Hawk-eyed'?1:0)+(hasSk(m,'eagle')||hasSk(m,'spotter')?1:0)}))}
function crIntelLine(){const r=S.raid,iq=crIntel(),down=r.cards.filter(c=>!c.up),rough=n=>iq>=6?String(n):n<=1?'one or two':n<=3?'a few':'several';

  return `<p class="small" style="margin:0;color:#9fc4d6" title="${esc(`Scouting ${iq}. Comes from your best reader of the ground: their level, +3 for a Scout, +1 Hawk-eyed, +1 Eagle eye or Spotter.\n3+: how many zombies are left · 4+: how much is worth searching · 6+: exact counts, and where the stash is.`)}">◎ ${parts.join(' · ')}${iq<6?' <span class="dim">(better scouts read more)</span>':''}</p>`}
function cardRaidView(){const r=S.raid,n=node(r.node),th=crThreats(),s=crS(),m=s&&memOf(s),A=m&&ABIL[m.trait],dark=r.turn>=r.limit,many=crHere().length>1;
  const abOk=m&&!r.uses[m.id]&&(m.trait==='Medic'||m.trait==='Scout'||th.length);
  if(ui.csel==='run'&&!(s&&s.slots>0))ui.csel=null;
  if(ui.csel==='leave'&&!th.length)ui.csel=null;
  if(ui.csel!=='run'&&ui.csel!=='abil'&&ui.csel!=='leave'){const c=r.cards[ui.csel];if(!c||c.done||!c.up||(c.t==='bar'&&c.open))ui.csel=th.length?r.cards.indexOf(th[0]):null}
  const tN=r.msgN||0,nNew=Math.min(3,tN-(ui.toastN??tN)),toast=nNew>0?`<div class="ctoast">${r.msgs.slice(0,nNew).reverse().map(x=>`<div class="${x.k}">${esc(x.t)}</div>`).join('')}</div>`:'';ui.toastN=tN;
  const out=`<div class="crwrap ${ui.csel!=null?'sheeton':''}"><header class="crhead pnl"><div><div class="eyebrow">${esc(n.name)} · day ${S.day}</div><h2>${esc(r.site.name)}</h2></div>
    <div class="crmeters"><span><span class="small dim">${dark?'Dark':'Light'}</span><span class="bar ${dark?'low':''}"><i style="width:${dark?100:(1-r.turn/r.limit)*100}%"></i></span><b class="small">${dark?'night':`${r.limit-r.turn} round${r.limit-r.turn===1?'':'s'}`}</b></span>
    <span class="${ui.noiseUp?'npulse':''}"><span class="small dim">Noise</span><span class="bar ${r.noise>=4?'low':r.noise>=2?'hmid':''}"><i style="width:${r.noise/6*100}%"></i></span><b class="small">${r.noise}/6</b></span>${ib(`Light: each round of daylight, everyone on the run gets one search (flip, pry or kick). Fights, bandages and abilities are free. After dark, searches can draw extra zombies.\nNoise: at 6, a zombie comes looking. Fights, guns and forcing barricades make noise.`)}</div></header>
    ${(()=>{const g=roleList(r.roles,'roof'),w=roleList(r.roles,'shop');return `<div class="small busline ${g.length?'':'bad'}">🚌 ${g.length?`Roof: ${g.map(shortName).join(', ')}`:'Nobody guarding the bus'}${w.length?` · Workshop: ${w.map(shortName).join(', ')}`:''}${r.busHits?` · bus −${r.busHits}`:''}</div>`})()}
    ${crCrewRow(false)}
    <div class="cracts">${A?`<button class="btn abilb ${abOk?'ready':''}" data-a="crabq">${A.glyph} ${A.name}<small>${r.uses[m.id]?'used':abOk?'ready · tap for details':'tap for details'}</small></button>`:''}${s&&S.res.meds>0?`<button class="btn tiny" data-a="crbandage" ${m.hp>=m.max?'disabled':''}>✚ Bandage</button>`:''}${s&&s.slots>0?`<button class="btn tiny" data-a="crrunq">↩ Run load back</button>`:''}<button class="btn tiny" data-a="clog">${ui.clog?'Hide log':'Log'}</button>${!crHere().length&&crIn().length?`<button class="btn tiny" data-a="crwait">⧗ Wait a round</button>`:''}${many&&m?`<span class="small dim">${esc(shortName(m))} ${crFree(s)?'searches next':'already searched: next search starts a new round'}</span>`:''}</div>
    ${ui.clog?crLog():''}
    ${crIntelLine()}
    ${[0,...Object.keys(r.rooms||{}).map(Number)].map(rm=>`${rm?`<div class="small" style="color:#d0a060;margin-top:4px">▦ ${esc(r.rooms[rm])}</div>`:''}<div class="cgrid">${r.cards.map((c,i)=>(c.room||0)===rm?crCard(c,i,!!th.length):'').join('')}</div>`).join('')}
    <footer class="crfoot"><button class="btn primary" data-a="${th.length?'crleaveq':'crleave'}">${th.length?'Rush for the bus':'Back to the bus'}${th.length?`<small>${th.length} still up · ${Math.round(crRush(false)*100)}% each gets hit</small>`:`<small>${listItems(Object.assign({},...crIn().map(s=>lootOf(s))))||'nothing yet'}</small>`}</button></footer></div>
    ${toast}${crSheet()}${ui.csel==null?tutBar():""}`;
  ui.flipI=null;ui.hitMid=null;ui.noiseUp=0;return out}
function csPow(s){const g=GM(s.load.ranged);if(s.fire&&crGunOk(s))return g.dmg+condOf(s.load.ranged).dmg;return crDmgEst(s,'walker',true)}
function csPreview(li){const r=S.raid,L=r.lanes[li],def=crIn().filter(p=>r.asg[p.mid]===li&&!r.errands.some(e=>e.mid===p.mid));
  let pow=def.reduce((a,p)=>a+csPow(p),0);if(def.length&&li===r.rackLane&&S.rack&&(S.rack.ranged!=='none'&&S.rack.ammo>0||S.rack.melee&&S.rack.melee!=='none'))pow+=2;
  let kills=0,left=[];L.forEach(z=>{if(pow>=z.hp){pow-=z.hp;kills++}else left.push(z)});
  if(!L.length)return '<span class="good">quiet</span>';
  if(!def.length){const d=Math.round(left.reduce((a,z)=>a+ZK[z.kind].dmg,0)*.6);return `<span class="bad">nobody here → bus −${Math.max(1,d)}</span>`}
  return left.length?`<span class="warn">~${kills} kill${kills===1?'':'s'}, ${left.length} left · someone may get hurt</span>`:`<span class="good">~${kills} kill${kills===1?'':'s'} · held</span>`}
function csAuto(){const r=S.raid,crew=crIn().filter(p=>!r.errands.some(e=>e.mid===p.mid)).sort((a,b)=>csPow(b)-csPow(a));
  const need=r.lanes.map(L=>L.length?L.reduce((a,z)=>a+z.hp,0):-5);crew.forEach(p=>{const li=need.indexOf(Math.max(...need));r.asg[p.mid]=li;need[li]-=csPow(p)+1});
  rmsg('Everyone takes the side that needs them most.')}
function cardSiegeView(){const r=S.raid,g=r.siege,s=crS(),done=g.done;
  const lane=(L,li)=>{const def=crIn().filter(p=>r.asg[p.mid]===li&&!r.errands.some(e=>e.mid===p.mid));
    return `<div class="lane ${def.length||!L.length?'':'open'}" data-a="cslane" data-arg="${li}" role="button" tabindex="0"><div class="cname"><b>${LANES[li]}</b>${li===r.rackLane&&S.rack&&(S.rack.ranged!=='none'||S.rack.melee!=='none')?`<span class="small" title="The roof rack covers this side while someone stands here">▲ rack</span>`:`<button class="btn tiny" data-a="csrack" data-arg="${li}" title="Point the roof rack at this side">▲ Rack here</button>`}</div>
      ${(r.traps||[])[li]?`<div class="small" style="color:var(--amber)">⊓ trap set</div>`:S.res.traps>0?`<button class="btn tiny" data-a="cstrap" data-arg="${li}">⊓ Set a trap (${S.res.traps})</button>`:''}<div class="lz">${L.length?L.map(z=>`<span class="zc" title="${ZK[z.kind].name}">☠<small>${ZK[z.kind].name.split(' ')[0]} ${'♥'.repeat(z.hp)}</small></span>`).join(''):'<span class="small dim">clear</span>'}</div>
      <div class="small">${def.length?def.map(p=>esc(memOf(p).name.split(' ')[0])).join(', '):''}</div><div class="small">${csPreview(li)}</div></div>`};
  return `<div class="crwrap"><header class="crhead pnl"><div><div class="eyebrow">${g.deep?'Deep front':'Hold the bus'} · ${esc(node(r.node).name)}</div><h2>${done?'The wave breaks':`Round ${r.round+1} of ${r.rounds}`}</h2></div>
    <div class="crmeters"><span><span class="small dim">Bus</span><span class="bar ${S.truck/S.truckMax<.3?'low':S.truck/S.truckMax<.6?'hmid':''}"><i style="width:${S.truck/S.truckMax*100}%"></i></span><b class="small">${S.truck}/${S.truckMax}</b></span>${S.rack&&S.rack.ranged!=='none'?`<span class="small dim">Rack ammo ${S.rack.ammo}</span>`:''}</div></header>
    ${crCrewRow(true)}
    <div class="cracts">${s?`<span class="small dim">Selected: <b style="color:var(--amber)">${esc(memOf(s).name)}</b>, tap a side to move them</span>`:''}${s&&GM(s.load.ranged)&&GM(s.load.ranged).dmg?`<button class="btn tiny ${s.fire?'on':''}" data-a="csfire">⌖ ${s.fire?'Shooting':'Melee only'}</button>`:''}${s&&S.res.meds>0?`<button class="btn tiny" data-a="crbandage" ${memOf(s).hp>=memOf(s).max?'disabled':''}>✚ Bandage</button>`:''}</div>
    <div class="row" style="gap:6px;align-items:center"><button class="btn tiny" data-a="csauto">⚡ Auto-defend</button><span class="small dim">or tap a person, then a side</span></div>
    <div class="lanes">${r.lanes.map(lane).join('')}</div>
    <div class="small dim" style="margin-top:2px">Out there</div><div class="crout">${r.out.map((o,i)=>{const e=r.errands.find(e=>e.i===i);return `<button class="btn tiny" data-a="cserr" data-arg="${i}" ${o.taken||e||!s||r.errands.some(e=>e.mid===s.mid)?'disabled':''} title="Sending someone leaves their side short-handed">${o.taken?'✓ fetched':e?`${esc(memOf(r.party.find(p=>p.mid===e.mid)).name.split(' ')[0])} · ${e.left} round${e.left>1?'s':''}`:`${resLabel(o.loot[0])} ×${o.loot[1]} · ${o.far} round${o.far>1?'s':''} away`}</button>`}).join('')||'<span class="small dim">nothing worth the risk</span>'}</div>
    ${crLog()}
    <footer class="crfoot">${done?`<button class="btn primary" data-a="csdepart">${ui.confirm==='depart'?'Depart without them':'Depart'}</button><button class="btn" data-a="csround">Wait one more round<small>a few more come</small></button>`:`<button class="btn primary" data-a="csround">Hold<small>round ${r.round+1} of ${r.rounds}</small></button>`}</footer></div>`}
function cardView(){if(S.raid.card==='siege'){const o=cardSiegeView()+tutBar();ui.hitMid=null;return o}return cardRaidView()}
function cardClick(a,arg){const r=S.raid;
  switch(a){
    case 'crsel':r.sel=+arg;break;
    case 'crflip':crFlip(+arg);return true;
    case 'cract':{const [k,i]=arg.split('|');crAct(k,+i);return true}
    case 'crab':crAbility();return true;
    case 'crbandage':crBandage();return true;
    case 'crleave':crLeave(false);return true;
    case 'cslane':{const s=crS();if(s&&!r.errands.some(e=>e.mid===s.mid))r.asg[s.mid]=+arg;break}
    case 'csrack':r.rackLane=+arg;break;
    case 'csauto':csAuto();break;
    case 'cstrap':if(S.res.traps>0){spend('traps',1);r.traps=r.traps||[];r.traps[+arg]=(r.traps[+arg]||0)+1;rmsg(`A trap goes down at the ${LANES[+arg].toLowerCase()}.`)}break;
    case 'crrunq':ui.csel='run';break;
    case 'crabq':ui.csel='abil';break;
    case 'crleaveq':ui.csel='leave';break;
    case 'crleavego':ui.csel=null;crLeave(false,arg);return true;
    case 'crrun':crRun(arg);return true;
    case 'crwait':crWait();return true;
    case 'csel':ui.csel=+arg;break;
    case 'cdesel':ui.csel=null;break;
    case 'clog':ui.clog=!ui.clog;break;
    case 'csfire':{const s=crS();if(s)s.fire=!s.fire;break}
    case 'cserr':{const s=crS(),o=r.out[+arg];if(s&&o&&!o.taken&&!r.errands.some(e=>e.i===+arg||e.mid===s.mid)){r.errands.push({mid:s.mid,i:+arg,left:o.far});rmsg(`${memOf(s).name} slips out to fetch the ${resLabel(o.loot[0]).toLowerCase()}.`,'warn')}break}
    case 'csround':ui.confirm=null;csRound(r.siege.done?(r.siege.deep?2:1):0);return true;
    case 'csdepart':csDepart();return true;
    default:return false}
  save();render();return true}

// ---- header: four key supplies, the rest behind a chip ----
function mobHead(){const g=gap(),key=['fuel','food','meds','ammo'],rest=RES.filter(([k])=>!key.includes(k)&&S.res[k]>0).length;

    <button class="mfront ${g<1?'danger':''}" data-a="info" data-arg="${esc(`The infection front is ${g.toFixed(1)} days behind you. Every drive it gains ground; resting lets it gain more. If it reaches your stop you have to hold the bus.`)}">☣ ${g.toFixed(1)}d</button>

// ---- crew cards get a one-tap station row ----
const ST_EFF={roof:'Guards the bus while others scavenge, and spots trouble on the road',shop:'+1 bus repair and +2 research per run · +1 research per drive',bunks:'+1 HP per run and per drive',store:'Sorts each haul for a chance of extra supplies · saves food on drives'};
function stChips(m){if(!canAct(m))return `<div class="stchips"><span class="small" style="color:#f3a493">Recovering: bunks only${m.recover?` · ${m.recover}d`:''}</span></div>`;
  return `<div class="stchips">${ST_KEYS.map(k=>{const here=S.station[m.id]===k,p=stationPerks(m,k).length;return `<button class="stc ${here?'on':''} ${p?'perk':''}" data-a="mst" data-arg="${m.id}|${k}" ${here?'aria-pressed="true"':''}>${ST_ICON[k]} ${ST_SHORT[k]}${p?'★':''}</button>`}).join('')}</div>${(()=>{const k=S.station[m.id];if(!ST_EFF[k])return '';ui.stSeen=ui.stSeen||new Set();const first=!ui.stSeen.has(k);ui.stSeen.add(k);const pk=stationPerks(m,k);if(!first&&!pk.length)return '';return `<div class="steff">${first?`${ST_ICON[k]} ${ST_EFF[k]}`:''}${pk.map((x,i)=>`${first||i?'<br>':''}<span class="good">★ ${esc(x)}</span>`).join('')}</div>`})()}`}

// ---- first stop: short coach marks ----
const tutDone=()=>{try{return localStorage.getItem('lc_tut')==='1'}catch(e){return false}};
function tutText(){if(tutDone()||!S||S.day>3)return '';const r=S.raid;
  if(r&&r.card==='raid')return r.turn===0?'Tap any card to search it. Every flip uses daylight, and noise brings zombies.':crThreats().length?'A threat! Tap it to see your options and the odds.':r.turn<4?'Keep flipping, or tap Back to the bus to leave with what you have.':'';
  if(r&&r.card==='siege')return 'Tap a person, then a side of the bus. Or tap Auto-defend. Then Hold.';
  if(ui.modal==='qsend')return 'Tap who goes (up to 3), then Go. Their kit is picked for you.';
  if(ui.modal==='drive')return 'Pick where to go next. Each drive costs fuel, food and a day. Stay ahead of the red.';
  if(!ui.modal&&!S.modal&&!r){const n=cur();return n.raids<1&&!n.revisit&&n.type!=='safe'?'Start here: tap Supply run.':'Done here? Tap Drive on.'}
  return ''}
function tutBar(){const t=tutText();return t?`<div class="tutbar ${S&&S.raid?'up':''}"><span>💡 ${esc(t)}</span><button class="btn tiny" data-a="tutoff">Got it</button></div>`:''}

// a little working figure for each room
function mobFig(m,k,i){const vh=[...m.id].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7),v=vh%3,sp=(.8+(vh%7)/10).toFixed(2),L=lookOf(m),r=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;

  const head=`<g class="fh">${r(3,1,8,7,L.skin)}${hair}${r(5,4,1,1,'#1b130c')}${r(8,4,1,1,'#1b130c')}</g>`,body=r(3,8,8,7,L.top)+r(3,8,8,1,faceColor(m));
  const legs=`<g class="fll">${r(4,15,2,6,L.pants)}</g><g class="flr">${r(8,15,2,6,L.pants)}</g>`,d=`style="--sp:${sp};animation-delay:${(-i*.6-(vh%5)*.3).toFixed(1)}s"`;
  if(k==='bunks'&&v===2)return `<svg class="mfig sit v2" viewBox="0 0 14 22" ${d} shape-rendering="crispEdges" aria-hidden="true">${r(0,17,14,3,'#3a4a44')}${r(4,13,6,4,L.pants)}${body}<g class="fbook">${r(1,9,2,4,L.skin)}${r(11,9,2,4,L.skin)}${r(2,10,10,3,'#c8b890')}${r(7,10,1,3,'#8a7a5a')}</g>${head}</svg>`;
  if(k==='bunks')return `<svg class="mfig lie" viewBox="0 0 26 14" ${d} shape-rendering="crispEdges" aria-hidden="true">${r(0,9,26,3,'#3a4a44')}<g transform="rotate(-90 7 7) translate(-4 0)">${r(3,1,8,7,L.skin)}${hair}${r(5,4,1,1,'#1b130c')}${r(8,4,1,1,'#1b130c')}${body}${r(4,15,2,6,L.pants)}${r(8,15,2,6,L.pants)}</g>${r(11,7,13,3,'#6b7d76')}<text class="zz" x="20" y="5" font-size="5" fill="#9fc4d6">z</text></svg>`;
  const arm=k==='shop'?`<g class="fhammer">${r(11,8,2,5,L.skin)}${r(12,5,1,6,'#8a6a3a')}${r(11,4,3,2,'#9aa4a0')}</g>${r(1,8,2,5,L.skin)}`:k==='store'?r(1,8,2,4,L.skin)+r(11,8,2,4,L.skin)+`<g class="fbox">${r(2,9,10,5,'#8a5f30')}${r(2,9,10,1,'#a87a40')}</g>`:r(1,8,2,6,L.skin)+`<g class="fgun">${r(11,7,2,6,L.skin)}${r(12,2,1,9,'#555')}</g>`;
  return `<svg class="mfig f-${k} v${v}" viewBox="0 0 14 22" ${d} shape-rendering="crispEdges" aria-hidden="true">${legs}${body}${arm}${head}</svg>`}
// phone bus: big, readable rooms instead of a scaled-down drawing
function mobileBus(){ensureStations();const B=busOf(),d=driver(),rk=S.rack||{ranged:'none',melee:'none',ammo:0};
  const who=k=>alive().filter(c=>S.station[c.id]===k&&c!==d);
  const face=(c,i)=>{const k=S.station[c.id],p=stationPerks(c,k).length,mk=c.bitten&&!c.hidden?'<i class="mk bad">☣</i>':!canAct(c)?'<i class="mk">☾</i>':unwilling(c)?'<i class="mk warn">☁</i>':'';
    return `<span class="mbf ${k==='bunks'?'wide':''}">${mobFig(c,k,i)}${mk}<small>${esc(shortName(c).slice(0,7))}${p?'<b>★</b>':''}</small></span>`};
  const rackTag=(rk.ranged&&rk.ranged!=='none')||(rk.melee&&rk.melee!=='none')?`<div class="mbt" style="color:#cfd8cc">rack: ${[rk.ranged&&rk.ranged!=='none'?esc(gearOf(rk.ranged).name)+' ×'+rk.ammo:'',rk.melee&&rk.melee!=='none'?esc(gearOf(rk.melee).name):''].filter(Boolean).join(' · ')}</div>`:'';
  const tools=k=>Object.entries(TOOLS).filter(([id,T])=>T.st===k&&hasT(id)).map(([,T])=>`<i title="${esc(T.name)}">${T.icon}</i>`).join('');
  const room=k=>{const L=who(k),cap=capSt(k);return `<div class="mbr mbr-${k}" ${k==='store'?'data-a="inv" data-arg="store" role="button"':`data-a="stinfo" data-arg="${k}" role="button"`} data-a="info" data-arg="${esc(STATIONS[k].name+': '+STATIONS[k].job+(ROAD[k]?'\nOn the road: '+ROAD[k].job+'.':'')+(tools(k)?'\nBuilt: '+Object.entries(TOOLS).filter(([id,T])=>T.st===k&&hasT(id)).map(([,T])=>T.name+' ('+T.desc+')').join('; '):''))}">
    <div class="mbh"><span>${ST_ICON[k]} ${STATIONS[k].name}</span><b>${L.length}/${cap}</b></div><div class="mbt">${tools(k)}</div>${k==='roof'?rackTag:''}
    <div class="mbfs">${L.map(face).join('')||'<span class="mbe">empty</span>'}</div></div>`};
  return `<div class="mbz" style="--bus:${B.color};--stripe:${B.stripe}">
    <div class="mbtop">${room('roof')}${room('shop')}</div>
    <div class="mbbody"><div class="mbrooms">${room('store')}${room('bunks')}</div>
      <div class="mbcab" data-a="info" data-arg="${esc(d?`${d.name} is driving.\n${driverPerks(d).length?driverPerks(d).join('\n'):'No driving perks. Drivers, Scouts, Night owls and Mechanics each bring something.'}\nChange the driver in the Drive on sheet.`:'Nobody can drive.')}"><small>Driver</small>${d?`<span class="mbf">${portrait(d,30)}<small>${esc(shortName(d).slice(0,7))}</small></span>`:'<span class="mbe">nobody</span>'}</div></div>
    <div class="mbstripe"></div><div class="mbwheels"><i></i><i></i></div>
    <div class="mbname">${esc(B.name)} · hull ${S.truck}/${S.truckMax}</div></div>`}
// tap Rest or Dinner: see exactly what it does, then confirm
